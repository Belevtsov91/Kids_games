# Обновления зависимостей раз в месяц, одним PR на экосистему, чтобы не засыпать репозиторий.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      all:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
