# Проверки на каждый PR и push в main/Admin: границы и размер файлов, типы, юнит- и API-тесты,
# актуальность all.sql, сборка сайта и админки. E2E (Playwright) — вручную или раз в сутки, они долгие.
name: ci

on:
  pull_request:
  push:
    branches: [main, Admin]
  schedule:
    - cron: '40 2 * * *'   # e2e ночью, 04:40 по Кишинёву (зимой)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Lint (границы игр, файлы ≤ 200 строк)
        run: corepack pnpm lint
      - name: Типы
        run: corepack pnpm typecheck
      - name: Юнит- и API-тесты
        run: corepack pnpm test
      - name: all.sql совпадает с миграциями
        run: |
          node tools/db-sql.mjs > /tmp/all.sql
          if ! diff -q all.sql /tmp/all.sql; then
            echo "::error file=all.sql::all.sql устарел: выполните node tools/db-sql.mjs > all.sql и закоммитьте"
            exit 1
          fi
      - name: Сборка сайта
        run: corepack pnpm --filter @ig/shell exec vite build
      - name: Админка
        working-directory: admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx vite build

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @ig/shell exec playwright install --with-deps chromium
      - name: E2E (десктоп и телефон)
        run: corepack pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: shell/playwright-report
          retention-days: 7
