<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Живые миниатюры · Visual Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#14223a;color:#f4ebd8;font:16px system-ui}main{max-width:1200px;margin:auto;padding:32px}a{color:#b8e3cd}h1{font-size:clamp(28px,5vw,48px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}article{border:1px solid #526378;border-radius:20px;overflow:hidden;background:#1c3049}h2,p{margin:18px}canvas{width:100%;height:270px;display:block}button{background:#e9cf99;border:0;border-radius:30px;padding:14px 24px;cursor:pointer;font:inherit}</style><main><a href="../index.html">← В каталог</a><h1>Маленькие живые миры</h1><p>Самостоятельные Canvas-концепты. Нажми на сцену: появится всплеск частиц. Движение можно остановить.</p><p><button id="toggle">Приостановить анимацию</button></p><div class="grid"></div></main><script>
const scenes=[['Музыка леса','notes','#40334e'],['Космический росток','garden','#17233c'],['Мастерская цвета','paint','#f5e7d0'],['Лунные светлячки','moon','#233d51']];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let running=!reduce;let tick=0;
const button=document.getElementById('toggle');button.textContent=running?'Приостановить анимацию':'Включить анимацию';button.onclick=()=>{running=!running;button.textContent=running?'Приостановить анимацию':'Включить анимацию';if(running)requestAnimationFrame(loop)};
const worlds=scenes.map(([title,kind,bg])=>{const a=document.createElement('article');const h=document.createElement('h2');h.textContent=title;const c=document.createElement('canvas');c.width=600;c.height=400;c.setAttribute('aria-label',title+' — интерактивный концепт');a.append(h,c);document.querySelector('.grid').append(a);const w={c,ctx:c.getContext('2d'),kind,bg,particles:[]};c.onclick=e=>{const r=c.getBoundingClientRect();for(let i=0;i<28;i++){const t=i/28*Math.PI*2;w.particles.push({x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*400,vx:Math.cos(t)*2,vy:Math.sin(t)*2,life:1})}if(!running)draw(w)};return w});
function dot(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function draw(w){const c=w.ctx;c.fillStyle=w.bg;c.fillRect(0,0,600,400);const t=tick/60;
if(w.kind==='notes'){c.fillStyle='#ae7e6a';c.fillRect(0,325,600,75);for(let i=0;i<7;i++){const x=60+i*80,y=260+Math.sin(t*3+i)*12;dot(c,x,y,25,['#e4b577','#dc8f96','#93bd87','#bda3d2','#81bcc7','#e4c477','#a6b4cf'][i]);c.fillStyle='#f5e3b0';c.font='36px serif';c.fillText('♪',x-8,130+Math.sin(t+i)*40)} }
if(w.kind==='garden'){for(let i=0;i<35;i++)dot(c,(i*137)%600,(i*71)%360,1.5,'#b0c8c4');c.strokeStyle='#8bc7a0';c.lineWidth=10;c.beginPath();c.moveTo(300,330);c.quadraticCurveTo(260,260,300+Math.sin(t)*10,180);c.stroke();for(let i=0;i<7;i++)dot(c,300+Math.sin(t)*10+Math.cos(i*Math.PI*2/7)*36,180+Math.sin(i*Math.PI*2/7)*36,23,'#b6a7d7');dot(c,300+Math.sin(t)*10,180,24,'#efd08b');c.fillStyle='#d5a48b';c.beginPath();c.moveTo(246,310);c.lineTo(354,310);c.lineTo(340,380);c.lineTo(260,380);c.fill();for(let i=0;i<8;i++)dot(c,140+Math.sin(t+i)*50,(t*60+i*51)%400,5,'#9cd5e5')}
if(w.kind==='paint'){for(let i=0;i<14;i++){let x=70+(i*113)%480,y=75+(i*79)%260;dot(c,x+Math.sin(t+i)*8,y,18+(i%4)*6,['#db9e9e','#e2c182','#95bdb0','#99afce'][i%4])}c.strokeStyle='#fdf6e8';c.lineWidth=12;c.lineCap='round';c.beginPath();for(let i=0;i<100;i++){let x=50+i*5,y=200+Math.sin(i/13+t)*65;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
if(w.kind==='moon'){dot(c,460,85,42,'#f3dca6');dot(c,477,74,40,w.bg);c.fillStyle='#365d65';c.beginPath();c.ellipse(300,380,330,100,0,0,7);c.fill();for(let i=0;i<35;i++){let x=30+(i*83)%540+Math.sin(t*.7+i)*18,y=80+(i*61)%240+Math.cos(t+i)*15;dot(c,x,y,2+Math.sin(t*2+i),'#d5e6ab')}}
w.particles=w.particles.filter(p=>p.life>0);for(const p of w.particles){c.globalAlpha=p.life;dot(c,p.x,p.y,5,'#ecc77d');if(running){p.x+=p.vx;p.y+=p.vy;p.life-=.012}}c.globalAlpha=1}
function loop(){tick++;worlds.forEach(draw);if(running)requestAnimationFrame(loop)}worlds.forEach(draw);if(running)requestAnimationFrame(loop);
</script></html>
